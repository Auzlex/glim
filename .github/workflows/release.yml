name: Release

on:
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Slang
        run: |
          curl.exe -L -o slang.zip https://github.com/shader-slang/slang/releases/download/v2026.13.1/slang-2026.13.1-windows-x86_64.zip

          $expected = "fa1c9bcab2cdcd3626f7a1e250dd35d606c1b84745b64627f1dd63fca3746a70"
          $actual = (Get-FileHash slang.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Error "Checksum mismatch! Expected $expected, but got $actual"
            exit 1
          }

          Expand-Archive slang.zip -DestinationPath "$env:RUNNER_TEMP\slang"
          "$env:RUNNER_TEMP\slang\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Remove-Item slang.zip

      - name: Build
        run: cargo build --release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/glim.dll

  build-linux:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libxcursor-dev

      - name: Install Slang
        run: |
          curl -sSL -o slang.tar.gz https://github.com/shader-slang/slang/releases/download/v2026.13.1/slang-2026.13.1-linux-x86_64.tar.gz

          EXPECTED="c1ed948af94c6fd2034cc0f82f6892b8b287d5362939758cb4955676f26d893e"
          echo "$EXPECTED  slang.tar.gz" | sha256sum -c -

          sudo tar --no-same-owner -xzf slang.tar.gz -C /usr/local
          rm slang.tar.gz

      - name: Build
        run: cargo build --release

      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/release/libglim.so

  release:
    permissions:
      contents: write
    needs:
      - build-windows
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: build/windows

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: build/linux

      - name: Read package.json
        id: package
        run: |
          NAME=$(jq -r '.name' unity/package.json)
          VERSION=$(jq -r '.version' unity/package.json)
          DISPLAY=$(jq -r '.displayName' unity/package.json)
          DESCRIPTION=$(jq -r '.description' unity/package.json)
          UNITY=$(jq -r '.unity' unity/package.json)

          echo "name=$NAME"              >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"        >> "$GITHUB_OUTPUT"
          echo "display=$DISPLAY"        >> "$GITHUB_OUTPUT"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"
          echo "unity=$UNITY"            >> "$GITHUB_OUTPUT"

      - name: Copy libraries
        run: |
          echo "--- Downloaded artifacts ---"
          ls -lR build/
          cp build/windows/glim.dll unity/Editor/glim.dll
          cp build/linux/libglim.so unity/Editor/glim.so
          echo "--- Verifying DLLs in unity/Editor ---"
          ls -lh unity/Editor/glim.dll unity/Editor/glim.so

      - name: Create zip
        run: |
          ZIP_NAME="${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip"

          cd unity
          zip -r "../$ZIP_NAME" .
          echo "--- Zip contents (Editor/) ---"
          cd ..
          unzip -l "$ZIP_NAME" | grep -i 'Editor/glim'

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          # Compute SHA-256 for VPM integrity checking
          SHA256=$(sha256sum "../$ZIP_NAME" | awk '{print $1}')
          echo "ZIP_SHA256=$SHA256" >> "$GITHUB_ENV"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            --draft \
            "v${{ steps.package.outputs.version }}" \
            "${{ env.ZIP_NAME }}" \
            --title "v${{ steps.package.outputs.version }}"

      # -----------------------------------------------------------------------
      # Notify the VPM listing repo (Auzlex/vpm) so its index.json is updated.
      # Requires a repo secret called VPM_PAT — a fine-grained PAT scoped to
      # Auzlex/vpm with Contents: Read and Write permission.
      # -----------------------------------------------------------------------
      - name: Dispatch VPM listing update
        env:
          GH_TOKEN: ${{ secrets.VPM_PAT }}
        run: |
          REPO="${{ github.repository_owner }}/vpm"
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.package.outputs.version }}/${{ env.ZIP_NAME }}"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${REPO}/dispatches \
            -f event_type=vpm-release \
            -f "client_payload[package_name]=${{ steps.package.outputs.name }}" \
            -f "client_payload[version]=${{ steps.package.outputs.version }}" \
            -f "client_payload[display_name]=${{ steps.package.outputs.display }}" \
            -f "client_payload[description]=${{ steps.package.outputs.description }}" \
            -f "client_payload[unity]=${{ steps.package.outputs.unity }}" \
            -f "client_payload[zip_url]=$ZIP_URL" \
            -f "client_payload[zip_sha256]=${{ env.ZIP_SHA256 }}"
